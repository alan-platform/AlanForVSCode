name: Publish
on:
  push:
    branches:
      - release
    tags-ignore:
      - 'published/*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc -p .
      - run: npx vsce package
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: npx vsce publish --azure-credential --packagePath *.vsix
      - run: npx ovsx publish -p $OVSX_TOKEN --packagePath *.vsix
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
      - name: Set VERSION & VERSION_TAG
        run: |
          VERSION=$(jq -j '.version' < ./package.json)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION_TAG=published/${VERSION}" >> $GITHUB_ENV
      - uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commitish: ${{ github.ref }}
          tag_name: ${{ env.VERSION_TAG }}
          release_name: Alan for Visual Studio Code v${{ env.VERSION }}
